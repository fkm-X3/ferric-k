[package]
name = "ferric-unsafe-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The only crate permitted to contain unsafe code: entry, drivers, locks, Limine ABI."

[dependencies]
ferric-api.workspace = true
ferric-safe-core.workspace = true
ferric-ui.workspace = true
# no_std embedded drawing for the clock app; same deliberate exception as in
# ferric-safe-core.
embedded-graphics = { version = "0.8", default-features = false }
# Slint GUI toolkit for the platform backend. Deliberate external runtime
# dependency (rule 3 exception, logged in ARCHITECTURE.md).
slint.workspace = true

[features]
# Boot-time deliberate panic to exercise the panic-handler path in QEMU.
panic-on-boot = []
# Boot-time deliberate divide-by-zero to exercise the exception-handler path.
exception-on-boot = []
# Launch the Slint GUI immediately at boot instead of the text console shell.
gui-on-boot = []

[lints]
workspace = true
