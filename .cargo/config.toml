# Ferric-K cargo configuration.
#
# NOTE on build-std: `-Zbuild-std` / `-Zjson-target-spec` deliberately live
# NOT here. A global `[unstable] build-std` also applies to *host* builds
# (e.g. `cargo test`), where cargo would then build a second `core` that
# collides with the prebuilt one behind std ("duplicate lang item `core`").
# Kernel-target invocations pass the flags explicitly — see xtask/src/check.rs.
#
# The build/check/run harness is a standalone xtask crate (NOT a workspace
# member, so `--workspace --target ...` kernel builds never try to compile it
# for a freestanding target). `cargo xtask <cmd>` routes here.

[alias]
# Single alias keeps cargo's real subcommands (check, run, ...) intact: the
# harness subcommands are namespaced as `cargo xtask <cmd>`.
xtask = "run --manifest-path xtask/Cargo.toml --"

# x86_64: link with the higher-half Limine layout (kernels/x86_64.ld) and pin
# the loader page size so every PT_LOAD gets p_align = 4 KiB regardless of
# linker defaults.
[target.x86_64-ferric]
rustflags = [
    "-C", "link-arg=-Tkernels/x86_64.ld",
    "-C", "link-arg=-z",
    "-C", "link-arg=max-page-size=0x1000",
]

# aarch64: same higher-half Limine layout (kernels/aarch64.ld); ld.lld
# defaults this arch to 64 KiB loader pages, so pin 4 KiB like on x86_64.
[target.aarch64-ferric]
rustflags = [
    "-C", "link-arg=-Tkernels/aarch64.ld",
    "-C", "link-arg=-z",
    "-C", "link-arg=max-page-size=0x1000",
]
