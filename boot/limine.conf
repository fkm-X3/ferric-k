# Limine Boot Protocol configuration for Ferric-K.
#
# Syntax per Limine v12.6.0 CONFIG.md. The file is staged at the root of the
# boot partition (a recognized scan location) by scripts/build-image.ps1.
# One image carries both kernels; if_arch hides whichever entry the running
# firmware cannot execute, so timeout: 0 autoboots the remaining entry.

timeout: 0

/Ferric-K (x86_64)
    protocol: limine
    if_arch: x86-64
    kernel_path: boot():/kernel-x86_64.elf

/Ferric-K (aarch64)
    protocol: limine
    if_arch: aarch64
    kernel_path: boot():/kernel-aarch64.elf
